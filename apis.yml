x-status-detail: >-
  The company's domain, agentsquared.com, has changed hands and no longer represents this
  company. WHOIS records the registration (created 2015-10-23) as updated 2026-02-11 with the
  registrar now DevExpanse Ltd d/b/a Regery.com, an aftermarket/drop-catch reseller. The domain
  now hosts an unrelated online-casino affiliate site: the WordPress REST discovery document at
  https://agentsquared.com/wp-json/ reports the site name as "Online Casinos", and the Yoast
  sitemap lists only "Best Online Casinos for US Players: Top Offshore Casino Sites in 2026",
  /casinos/, /responsible-gambling/, /how-we-evaluate/, /about-our-team/ and /contact-us/, all
  last modified 2026-04-22. Every page of the former real estate site now 404s (/pricing/,
  /support/, /blog/, /mls-partners/, /how-it-works/, /about-us/, /technology-partners/), and the
  customer login host dashboard.agentsquared.com no longer resolves in DNS. Wayback captures show
  the real estate site intact through 2025-12-15 and a 403 by 2026-07-05. BECAUSE THE DOMAIN IS
  UNDER THIRD-PARTY CONTROL IT IS DELIBERATELY NOT WIRED AS A Website POINTER, and no
  DomainSecurity artifact was produced for it — TLS, SPF, DMARC and CAA records on that host now
  describe the casino affiliate operator, not AgentSquared. The only live surface the company
  itself still controls is its LinkedIn company page.
x-name-collision: >-
  DO NOT CONFLATE WITH agentsquared.net. A distinct and unrelated company, "AgentSquared (A2),
  the co-evolving agent network", registered agentsquared.net on 2026-03-10 and operates an AI
  agent platform with a GitHub organization (AgentSquaredNet), a Skills repository and an npm
  package (@agentsquared/cli). None of that surface belongs to this record, which profiles the
  2013 La Jolla real estate marketing company listed on EquityZen. A future enrichment pass that
  attaches agentsquared.net artifacts here would be crediting this company with another
  company's API.
