aid: agentsquared
name: AgentSquared
description: >-
  AgentSquared was a La Jolla, California real estate marketing technology company, founded in
  2013 by Albert Lopez and a team its LinkedIn page describes as "Internet pioneers who have
  founded, built and sold leading brand name Internet companies such as Media Temple, Miva, and
  Attracta." Its product was marketing automation for real estate agents and brokers: Instant IDX
  websites provisioned with a single click, single-property websites generated automatically for
  new listings, social sharing of those listings, lead capture and CRM, and Google Business
  Profile and Local Services Ads management. The company was notable as an API CONSUMER rather
  than an API producer — it was a RESO (Real Estate Standards Organization) member and one of the
  few vendors building on the National Association of Realtors Web API standard, using deep
  integrations and channel partnerships with MLS software providers to pull a broker's identity
  and listing data straight out of the MLS and stand up a fully populated website from it. It
  worked with RESO to help define and document the client portion of the RESO Web API
  certification program. AgentSquared never published a developer program of its own: no
  developer portal, API reference, OpenAPI or other machine-readable contract, SDK, or public
  package ever appeared on its site. The company reached roughly $961K in reported revenue
  without raising venture capital. Its web presence is now gone — see x-status below.
